spring.application.name=order-service

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5433}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.validate-migration-naming=true

management.endpoints.web.exposure.include=health,info

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.order-events-topic=order.events
app.kafka.inventory-events-topic=inventory.events

app.outbox.publish-interval-ms=1000

# Rows claimed per poll with FOR UPDATE SKIP LOCKED. The claiming transaction
# stays open for the whole batch, so batch-size x send-timeout-ms bounds how
# long this replica can hold those row locks.
app.outbox.batch-size=100

# How long to wait for the broker to acknowledge one send. A timeout here does
# not cancel the record, so a send that lands late is published again later;
# consumers deduplicate on eventId.
app.outbox.send-timeout-ms=10000

app.kafka.enabled=true

# Consumer failure policy: bounded retries with exponential backoff,
# then publication to <topic>.DLT (see KafkaErrorHandlingConfig).
app.kafka.retry.attempts=4
app.kafka.retry.initial-interval=500ms
app.kafka.retry.multiplier=2.0
app.kafka.retry.max-interval=5s
