spring.application.name=payment-service

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.order-events-topic=order.events
app.kafka.payment-events-topic=payment.events

spring.datasource.url=jdbc:postgresql://${PAYMENT_POSTGRES_HOST:127.0.0.1}:${PAYMENT_POSTGRES_PORT:5435}/${PAYMENT_POSTGRES_DB:payment}
spring.datasource.username=${PAYMENT_POSTGRES_USER:payment_user}
spring.datasource.password=${PAYMENT_POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.validate-migration-naming=true

app.outbox.publish-interval-ms=1000

# Rows claimed per poll with FOR UPDATE SKIP LOCKED. Batch size no longer
# bounds the lock hold (the poll deadline does); it only sizes the claim.
app.outbox.batch-size=25

# How long to wait for the broker to acknowledge one send. A timeout here does
# not cancel the record, so a send that lands late is published again later;
# consumers deduplicate on eventId. A timeout also ends the poll early: it
# signals broker degradation, not a bad record.
app.outbox.send-timeout-ms=2000

# Hard cap on how long one poll keeps sending. The claim transaction holds row
# locks and one pooled connection, so worst-case hold is
# poll-deadline + max.block.ms + send-timeout = 4s + 2s + 2s = 8s,
# independent of batch size. Unreached rows stay pending for the next poll.
app.outbox.poll-deadline-ms=4000

# Caps how long KafkaTemplate.send() itself may block on producer metadata
# (default 60s), which would otherwise sit inside the outbox claim transaction.
spring.kafka.producer.properties.max.block.ms=2000
app.outbox.publisher-enabled=true

# Consumer failure policy: bounded retries with exponential backoff,
# then publication to <topic>.DLT (see KafkaErrorHandlingConfig).
app.kafka.retry.attempts=4
app.kafka.retry.initial-interval=500ms
app.kafka.retry.multiplier=2.0
app.kafka.retry.max-interval=5s

# SIMULATED payment provider (SimulatedPaymentGateway): amounts strictly below
# the threshold are approved, amounts at or above it are declined. Purely a
# deterministic dev/test mechanism - no real charges happen anywhere.
app.payment.gateway.decline-threshold=1000.00
# Retention: bounded, batched deletion of rows whose job is done — published
# outbox events (by published_at) and processed-event ledger rows (by
# processed_at). Unpublished outbox rows are never deleted. Each run deletes
# at most batch-size * max-batches-per-run rows per table, each batch in its
# own short transaction, claimed with FOR UPDATE SKIP LOCKED so concurrent
# replicas partition the work. All bounds are validated at startup;
# non-positive values refuse to boot.
#
# processed-events-max-age guards the idempotency ledger, not history: a
# deleted row re-enables its eventId, and for payments a re-enabled
# ORDER_CONFIRMED is additionally absorbed by the payments.order_id unique
# guard — but the ledger window MUST still exceed the Kafka source topic's
# retention plus the maximum operational replay/DLT-redrive window; raise it
# in step with any of those horizons.
app.retention.enabled=true
app.retention.interval-ms=300000
app.retention.outbox-max-age=7d
app.retention.processed-events-max-age=30d
app.retention.batch-size=500
app.retention.max-batches-per-run=10
