spring.application.name=inventory-service

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.order-events-topic=order.events

spring.datasource.url=jdbc:postgresql://${INVENTORY_POSTGRES_HOST:127.0.0.1}:${INVENTORY_POSTGRES_PORT:5434}/${INVENTORY_POSTGRES_DB:inventory}
spring.datasource.username=${INVENTORY_POSTGRES_USER:inventory_user}
spring.datasource.password=${INVENTORY_POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.validate-migration-naming=true

app.kafka.inventory-events-topic=inventory.events
app.outbox.publish-interval-ms=1000

# Rows claimed per poll with FOR UPDATE SKIP LOCKED. Batch size no longer
# bounds the lock hold (the poll deadline does); it only sizes the claim.
app.outbox.batch-size=25

# How long to wait for the broker to acknowledge one send. A timeout here does
# not cancel the record, so a send that lands late is published again later;
# consumers deduplicate on eventId. A timeout also ends the poll early: it
# signals broker degradation, not a bad record.
app.outbox.send-timeout-ms=2000

# Hard cap on how long one poll keeps sending. The claim transaction holds row
# locks and one pooled connection, so worst-case hold is
# poll-deadline + max.block.ms + send-timeout = 4s + 2s + 2s = 8s,
# independent of batch size. Unreached rows stay pending for the next poll.
app.outbox.poll-deadline-ms=4000

# Caps how long KafkaTemplate.send() itself may block on producer metadata
# (default 60s), which would otherwise sit inside the outbox claim transaction.
spring.kafka.producer.properties.max.block.ms=2000
app.outbox.publisher-enabled=true

# Bounded retention (see RetentionCleanupJob). Only published outbox rows and
# processed_events rows past their age are ever deleted; unpublished outbox
# rows are structurally unreachable. Every DELETE is LIMITed to batch-size and
# a run issues at most max-batches-per-run batches per table, each in its own
# transaction, claimed with FOR UPDATE SKIP LOCKED so concurrent replicas
# partition the work. processed-events-max-age bounds the dedup window: keep
# it longer than any redelivery horizon (broker retention, DLT redrive).
app.retention.enabled=true
app.retention.cleanup-interval-ms=3600000
app.retention.published-outbox-max-age=7d
app.retention.processed-events-max-age=14d
app.retention.batch-size=500
app.retention.max-batches-per-run=10

# Consumer failure policy: bounded retries with exponential backoff,
# then publication to <topic>.DLT (see KafkaErrorHandlingConfig).
app.kafka.retry.attempts=4
app.kafka.retry.initial-interval=500ms
app.kafka.retry.multiplier=2.0
app.kafka.retry.max-interval=5s
