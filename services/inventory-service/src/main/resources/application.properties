spring.application.name=inventory-service

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.order-events-topic=order.events

spring.datasource.url=jdbc:postgresql://${INVENTORY_POSTGRES_HOST:127.0.0.1}:${INVENTORY_POSTGRES_PORT:5434}/${INVENTORY_POSTGRES_DB:inventory}
spring.datasource.username=${INVENTORY_POSTGRES_USER:inventory_user}
spring.datasource.password=${INVENTORY_POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.validate-migration-naming=true
