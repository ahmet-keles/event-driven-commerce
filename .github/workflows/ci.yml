name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # One job per service. fail-fast is off so both results are reported,
    # but the workflow still fails if either service fails.
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        service:
          - inventory-service
          - order-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      # ubuntu-latest runners ship with a running Docker daemon, which is all
      # Testcontainers needs to start the PostgreSQL and Kafka containers.
      - name: Run ${{ matrix.service }} tests
        working-directory: services/${{ matrix.service }}
        run: ./mvnw -B --no-transfer-progress test
