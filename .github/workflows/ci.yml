name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # One job per service. fail-fast is off so both results are reported,
    # but the workflow still fails if either service fails.
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        service:
          - inventory-service
          - order-service
          - payment-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Cache keys are per job: GitHub Actions cache entries are
          # immutable per key, so parallel jobs sharing one key would race —
          # the first save wins and the others could never add their own
          # dependencies. Each matrix leg caches against its own pom.
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Verify Docker and pre-pull test images
        run: .github/scripts/prepare-docker.sh postgres:17-alpine apache/kafka:4.0.0

      - name: Run ${{ matrix.service }} tests
        working-directory: services/${{ matrix.service }}
        run: ./mvnw -B --no-transfer-progress test

  e2e:
    # Cross-service end-to-end suite (integration-tests/): builds both boot
    # jars, then runs the saga against real Kafka + two PostgreSQL instances
    # and both apps as containers. Independent of the matrix job on purpose:
    # a red here means the seam is broken, a red there means a service is.
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # This job builds both services and the e2e module, so its cache
          # key covers all three poms; the key differs from the matrix jobs'
          # keys, keeping each job's immutable cache entry self-consistent.
          cache-dependency-path: |
            services/order-service/pom.xml
            services/inventory-service/pom.xml
            integration-tests/pom.xml

      - name: Verify Docker and pre-pull test images
        run: .github/scripts/prepare-docker.sh postgres:17-alpine apache/kafka:4.0.0 eclipse-temurin:21-jre

      - name: Build order-service jar
        working-directory: services/order-service
        run: ./mvnw -B --no-transfer-progress -DskipTests package

      - name: Build inventory-service jar
        working-directory: services/inventory-service
        run: ./mvnw -B --no-transfer-progress -DskipTests package

      - name: Run end-to-end tests
        working-directory: integration-tests
        run: ./mvnw -B --no-transfer-progress test
